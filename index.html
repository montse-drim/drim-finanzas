<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIM · Finanzas</title>
<style>
:root{--bg:#fff;--card:#fff;--field:#f5f5f5;--tx:#0a0a0a;--mut:#6f6f6f;--bd:#e8e8e8;--pri:#0a3681;--pri-tx:#fff;--link:#0a3681;--acc:#f4f40b;--ok:#0f7b4f;--bad:#c0392b;--warn:#8a6100;--hover:#f7f7f7}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#0a0a0a;--field:#171717;--tx:#f2f2f2;--mut:#9a9a9a;--bd:#262626;--pri:#f4f40b;--pri-tx:#000;--link:#f4f40b;--ok:#3ecf9b;--bad:#ff7a6b;--warn:#f4f40b;--hover:#121212}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:0 32px;align-items:center;padding:0 28px;background:#000;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:14px;padding:14px 0}
.brand img{height:26px;width:auto;display:block}
.brand span{color:#bdbdbd;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-left:1px solid #333;padding-left:14px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:21px 12px 19px;color:#a3a3a3;font:inherit;font-size:13px;cursor:pointer}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--acc)}
nav .badge{background:var(--acc);color:#000;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:6px}
main{max-width:1120px;margin:0 auto;padding:36px 24px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:22px;margin-bottom:18px}
.card h2{font-size:11px;margin:0 0 16px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:18px}
.grid>.card{margin-bottom:0}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}.warn{color:var(--warn)}
a{color:var(--link)}
button.b,a.b{background:var(--pri);color:var(--pri-tx);border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
button.b:hover{opacity:.88}
button.g,label.g{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-block;margin:0;text-transform:none;letter-spacing:0}
button.g:hover,label.g:hover{border-color:var(--tx)}
button.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit;font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--field);border:1px solid transparent;border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tx);background:var(--bg)}
input[type=checkbox]{accent-color:var(--pri)}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
label>*{margin-top:4px;text-transform:none;letter-spacing:0}
label[style*="display:flex"]{text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.bar>*{width:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:10.5px;color:var(--mut);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.av{width:30px;height:30px;border-radius:50%;background:var(--field) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mut);vertical-align:middle;margin-right:10px;flex:none;overflow:hidden}
.av.lg{width:76px;height:76px;font-size:24px;margin-right:0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;border:1px solid var(--bd);color:var(--mut);margin-right:4px;white-space:nowrap}
.tag.p{color:var(--warn);border-color:var(--warn)}.tag.c{color:var(--ok);border-color:var(--ok)}.tag.r{color:var(--bad);border-color:var(--bad)}
.alert{border-left:3px solid var(--acc)}.alert.r{border-left-color:var(--bad)}.alert.g{border-left-color:var(--ok)}
.alert p{margin:0 0 12px}
#sub{max-width:1120px;margin:0 auto;padding:20px 24px 0;display:flex;gap:8px;flex-wrap:wrap}
#sub:empty{display:none}
#sub button{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
#sub button:hover{border-color:var(--tx);color:var(--tx)}
#sub button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
#sub .badge{background:var(--acc);color:#000;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:6px}
.lead{font-size:17px;line-height:1.55;max-width:72ch;margin:0 0 20px;color:var(--tx)}
.lead b{font-weight:600}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:6px 0 20px}
.mini>div{border-top:1px solid #333;padding-top:10px}
.mini .l{color:#a8a8a8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.mini .v{font-size:21px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.mini .v.ok{color:#7ee0b4}.mini .v.bad{color:#ff7a6b}
h1.pg{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sec h3{margin:0;font-size:15px;font-weight:600}
@media(max-width:700px){#sub{padding:14px 14px 0}}
.todo{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.todo:first-child{padding-top:0}.todo:last-child{border-bottom:0;padding-bottom:0}
.todo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.todo.r::before{background:var(--bad)}.todo.g::before{background:var(--ok)}
.todo>div{flex:1}
.hero{background:#000;color:#fff;border:1px solid #000;padding:30px}
.hero .lab{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#a8a8a8}
.hero .big{font-size:46px;font-weight:600;letter-spacing:-.03em;color:var(--acc);margin:6px 0 12px;font-variant-numeric:tabular-nums}
.hero .mut{color:#a8a8a8}.hero .warn{color:var(--acc)}.hero b{font-weight:600}
.hero .tag{border-color:#444;color:#ccc}.hero .tag.c{color:#7ee0b4;border-color:#7ee0b4}
@media (prefers-color-scheme:dark){.hero{border-color:#262626}}
.cal{font-size:11px}.cal th,.cal td{padding:3px 0;text-align:center;border-bottom:1px solid var(--bd);min-width:22px}
.cal th.nm{text-align:left;padding-right:14px;white-space:nowrap;font-size:12px;text-transform:none;letter-spacing:0;color:var(--tx);font-weight:500;position:sticky;left:0;background:var(--bg)}
.cal .we{background:var(--field)}.cal tbody tr:hover td{background:none}.cal tbody tr:hover td.we{background:var(--field)}
.cel{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-weight:700;font-size:10.5px}
.cV{background:var(--acc);color:#000}.cF{background:var(--bad);color:#fff}.cR{border:1px solid var(--tx);color:var(--tx)}.cP{background:#0a3681;color:#fff}.cS{background:var(--tx);color:var(--bg)}.cI{background:var(--ok);color:#fff}.cO{background:var(--mut);color:#fff}.cG{background:#0e7490;color:#fff}
.cov td,.cov th{text-align:center;padding:8px}.cov td.y{color:var(--ok)}.cov td.z{color:var(--bad);font-weight:700}.cov td:first-child,.cov th:first-child{text-align:left}
.file{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.drop{border:1.5px dashed var(--bd);border-radius:10px;padding:28px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--tx);color:var(--tx)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:26px}
dialog::backdrop{background:#000a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hb{display:flex;align-items:center;gap:12px;margin:10px 0}
.hb .nm{width:150px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;background:var(--field);border-radius:4px;height:8px;overflow:hidden}
.hb .fl{height:100%;background:var(--tx);border-radius:4px}
.hb .am{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.log{font-size:12px;color:var(--mut);margin:4px 0 0;padding-left:16px}
#toast{display:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000;color:#fff;border-left:4px solid var(--ok);padding:12px 20px;border-radius:8px;z-index:99;max-width:90vw;box-shadow:0 6px 24px #0005;font-weight:500}
#toast.bad{border-left-color:#ff7a6b}
.banner{background:#000;color:var(--acc);padding:12px 16px;border-radius:8px;margin-bottom:16px}
input.err{border-color:var(--bad)}
@media(max-width:700px){header{padding:0 16px}.two{grid-template-columns:1fr}.hb .nm{width:90px}main{padding:24px 14px 70px}.hero .big{font-size:36px}}
</style>
</head>

<script>window.__fbReady = new Promise(r => { window.__fbResolve = r; });</script>
<script>
(async () => {
'use strict';
const KEY = 'finanzas_negocio_v1';
const $ = (s, r = document) => r.querySelector(s);
const toast = (msg, bad) => { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', bad ? 7000 : 2500); };
window.alert = m => toast(m, true);
function askConfirm(msg, fn) {
  const d = document.getElementById('dlg2');
  d.innerHTML = `<form method="dialog"><p style="margin-top:0">${String(msg).replace(/</g, '&lt;')}</p><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button type="button" class="g" data-x="no">Cancelar</button><button type="button" class="b" data-x="si">Aceptar</button></div></form>`;
  d.querySelector('[data-x=no]').onclick = () => d.close();
  d.querySelector('[data-x=si]').onclick = () => { d.close(); fn(); };
  if (!d.open) d.showModal();
}
function askText(title, val, fn) {
  const d = document.getElementById('dlg2');
  d.innerHTML = `<form method="dialog"><label>${String(title).replace(/</g, '&lt;')}<input id="askIn"></label><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button type="button" class="g" data-x="no">Cancelar</button><button class="b" data-x="si">Guardar</button></div></form>`;
  d.querySelector('#askIn').value = val || '';
  d.querySelector('[data-x=no]').onclick = () => d.close();
  d.querySelector('form').onsubmit = () => { const v = d.querySelector('#askIn').value.trim(); if (v) fn(v); };
  if (!d.open) d.showModal();

function balance(a, until) {
  let b = +a.initial || 0;
  for (const t of S.tx) {

  { const ret = S.clientes.map(c => ({c, k: cobranza(c)})).filter(x => x.k.venc > cuota(x.c) * 0.5); if (ret.length) al.push(`<div class="todo r"><div><b>${ret.length} ${ret.length === 1 ? 'cliente retrasado' : 'clientes retrasados'}</b> por ${money(ret.reduce((s, x) => s + x.k.venc, 0))}: ${ret.slice(0, 4).map(x => esc(x.c.nombre)).join(', ')}${ret.length > 4 ? ' y más' : ''}.</div><button class="g" data-v="clientes">Ver cobranza</button></div>`); }
  { const v = vacProgramadas().filter(x => x.curso || enDias14(x.from)); if (v.length) al.push(`<div class="todo"><div><b>Vacaciones: ${v.length} ${v.length === 1 ? 'persona' : 'personas'} fuera en los próximos 14 días</b> · ${v.slice(0, 3).map(x => esc(shortName(x.name)) + (x.curso ? ' (ya está fuera, regresa ' + fmtDia(x.regresa) + ')' : ' (sale el ' + fmtDia(x.from) + ')')).join(', ')}${v.length > 3 ? ' y más' : ''}.</div><button class="g" data-v="vacaciones">Ver vacaciones</button></div>`); }

  if (!al.length && S.tx.length) al.push(`<div class="todo g"><div><b>✓ Todo al corriente:</b> sin facturas pendientes, sin huecos en estados de cuenta.</div></div>`);
  if (!S.tx.length) al.push(`<div class="todo"><div><b>Empieza cargando tus estados de cuenta</b> de enero a la fecha (Bajío, BBVA y Clara).</div><button class="g" data-v="datos">Cargar estados de cuenta</button></div>`);

  // lo que afecta tu dinero hoy va primero; los pendientes de papeleo, al final
  { const u = auditoriaRH().filter(a => a.sev === 'r'); if (u.length) al.push(`<div class="todo"><div><b>Auditor de RH: ${u.length} ${u.length === 1 ? 'alerta urgente' : 'alertas urgentes'}</b> — ${esc(u.slice(0, 2).map(a => a.titulo).join('; '))}${u.length > 2 ? ' y más' : ''}.</div><button class="g" data-v="vacaciones">Ver auditor</button></div>`); }
  const pr = h => /clientes? retrasados?|cliente retrasado/.test(h) ? 1 : /de IVA/.test(h) ? 2 : /el banco muestra/.test(h) ? 3 : /Faltan estados/.test(h) ? 4 : /vacaciones por programar|Auditor de RH/.test(h) ? 5 : /Faltan facturas/.test(h) ? 6 : 7;
  al.sort((x, y) => pr(x) - pr(y));
  const top = al.slice(0, 5), more = al.slice(5), hoy = new Date().toLocaleDateString('es-MX', {day: 'numeric', month: 'long', year: 'numeric'});
  return `<h1 class="pg">Resumen del negocio</h1><p class="sub" style="color:var(--mut);margin:0 0 22px">Al ${hoy}</p>

  <div class="grid">
    <div class="card kpi"><div class="l">Ingresos cobrados</div><div class="v ok">${money(ing)}</div></div>
    <div class="card kpi"><div class="l">Gastos pagados</div><div class="v bad">${money(gas)}</div></div>

      <div class="mut" style="font-size:12px"><span style="color:var(--pri)">■</span> Ingresos &nbsp; <span style="color:var(--tx)">■</span> Gastos &nbsp;·&nbsp; Los pagos de tarjeta y traspasos no cuentan como gasto.</div></div>
    <div class="card"><h2>Gastos por categoría</h2>
      ${rows.length ? rows.slice(0, 10).map(([id, v]) => `<div class="hb"><div class="nm">${esc(catName(id))}</div><div class="tr"><div class="fl" style="width:${v / max * 100}%"></div></div><div class="am">${money(v)}</div></div>`).join('') : '<div class="mut">Aún no hay gastos en este periodo.</div>'}
    </div></div>`;
}

/* ---------- Movimientos ---------- */
function filtered() {
  return S.tx.filter(t =>
    (!F.mes || ym(t.date) === F.mes) && (!F.tipo || t.type === F.tipo) && (!F.cat || t.catId === F.cat) &&
    (!F.cta || t.accountId === F.cta || t.toAccountId === F.cta) &&
    (!F.est || (F.est === 'pendiente' ? t.status === 'pendiente' : F.est === 'conciliado' ? t.reconciled : F.est === 'sinfactura' ? needsInvoice(t) : (!t.reconciled && t.status !== 'pendiente'))) &&
    (!F.q || (t.desc + ' ' + t.party + ' ' + t.ref + ' ' + t.notes + ' ' + catName(t.catId)).toLowerCase().includes(F.q.toLowerCase()))
  ).sort((a, b) => b.date.localeCompare(a.date));
}
const invTag = t => t.type === 'transferencia' || t.status === 'pendiente' ? '' :
  t.files?.length ? `<span class="tag c">Factura · ${t.files.length}</span>` : t.noInv ? '<span class="tag">No requiere factura</span>' : needsInvoice(t) ? '<span class="tag r">Sin factura</span>' : '';

  return `
  <div class="card">

      <select data-f="mes">${opt([...monthOptions()].map(k => [k, mesLabel(k)]), F.mes, 'Todos los meses')}</select>

      <input data-f="q" placeholder="Buscar…" value="${esc(F.q)}" style="min-width:150px">

    </div>
    <div class="mut" style="margin-bottom:8px">${list.length} movimientos · Ingresos <b class="ok">${money(i)}</b> · Gastos <b class="bad">${money(g)}</b></div>
    <div class="tbl"><table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Cuenta</th><th>Estatus</th><th class="n">Monto</th><th></th></tr></thead>
      <tbody>${list.slice(0, 500).map(t => `<tr>
        <td>${t.date}</td>
        <td>${esc(t.desc)}<div class="mut" style="font-size:12px">${[t.party, t.ref && 'Ref: ' + t.ref].filter(Boolean).map(esc).join(' · ')}</div></td>
        <td>${t.type === 'transferencia' ? '<span class="tag">Transferencia</span>' : esc(catName(t.catId))}</td>
        <td>${esc(accName(t.accountId))}${t.type === 'transferencia' ? ' → ' + esc(accName(t.toAccountId)) : ''}</td>
        <td>${t.status === 'pendiente' ? '<span class="tag p">Pendiente</span>' : t.reconciled ? '<span class="tag c">Conciliado</span>' : '<span class="tag">Registrado</span>'}${invTag(t)}</td>
        <td class="n ${isNeutral(t) ? 'mut' : t.type === 'ingreso' ? 'ok' : t.type === 'gasto' ? 'bad' : ''}">${t.type === 'gasto' ? '-' : ''}${money(t.amount)}</td>
        <td class="n"><button class="g" data-a="edit" data-id="${t.id}">Ver / editar</button></td></tr>`).join('') || '<tr><td colspan="7" class="mut">Sin movimientos con estos filtros.</td></tr>'}

}

function txDialog(t) {
  const isNew = !t;
  t = t ? {...t, files: [...(t.files || [])]} : {id: uid(), date: today(), type: 'gasto', amount: '', accountId: S.accounts[0]?.id, toAccountId: '', catId: '', desc: '', party: '', ref: '', status: 'pagado', reconciled: false, noInv: false, notes: '', files: [], log: []};
  const d = $('#dlg');
  const readForm = f => { const o = {}; for (const el of f.elements) if (el.name && el.type !== 'file') o[el.name] = el.type === 'checkbox' ? el.checked : el.value; return o; };
  const draw = () => {
    d.innerHTML = `<form method="dialog" id="f">
      <h2 style="margin-top:0">${isNew ? 'Nuevo movimiento' : 'Movimiento'}</h2>
      <div class="two">
        <label>Tipo<select name="type"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option><option value="transferencia">Transferencia entre cuentas</option></select></label>

        <label>Estatus<select name="status"><option value="pagado">${t.type === 'ingreso' ? 'Cobrado' : 'Pagado'}</option><option value="pendiente">Pendiente</option></select></label>
        <label>${t.type === 'transferencia' ? 'Cuenta origen' : 'Cuenta / tarjeta'}<select name="accountId">${S.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
        ${t.type === 'transferencia'
          ? `<label>Cuenta destino<select name="toAccountId">${S.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>`
          : `<label>Categoría<select name="catId">${catsOf(t.type).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`}
      </div>
      <label>Descripción<input name="desc" required placeholder="Ej. Nómina quincena 1 octubre"></label>
      <div class="two">
        <label>${t.type === 'ingreso' ? 'Cliente' : 'Proveedor / Empleado'}<input name="party"></label>
        <label>Folio / UUID de factura<input name="ref"></label>
      </div>
      ${t.type === 'transferencia' ? '' : '<label>IVA incluido en el monto (opcional; vacío = 16% automático)<input type="text" inputmode="decimal" name="iva" placeholder="auto"></label>'}
      <label>Notas<textarea name="notes" rows="2"></textarea></label>
      ${t.type === 'transferencia' ? '' : `<div style="margin-bottom:10px"><div class="mut" style="font-size:12px">Facturas / tickets (PDF, XML o foto)</div>
        ${t.files.map(x => `<div class="file"><a href="#" data-open="${x.id}">${esc(x.name)}</a> <button type="button" class="x" data-rm="${x.id}">quitar</button></div>`).join('')}
        <label class="g" style="margin-top:6px">+ Adjuntar archivo<input type="file" id="fileIn" multiple accept=".pdf,.xml,image/*" hidden></label>
        <label style="display:flex;gap:8px;align-items:center;margin:8px 0 0"><input type="checkbox" name="noInv" style="width:auto;margin:0"> Este movimiento no requiere factura</label></div>`}
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="reconciled" style="width:auto;margin:0"> Conciliado con el estado de cuenta</label>
      ${(t.log || []).length ? `<details><summary class="mut">Historial de cambios (${t.log.length})</summary><ul class="log">${t.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}
      <div class="bar" style="margin:16px 0 0">
        ${isNew ? '' : `<button type="button" class="x" id="del">Eliminar</button>`}
        <span style="flex:1"></span>
        <button type="button" class="g" id="cancel">Cancelar</button>
        <button class="b" value="ok">Guardar</button>
      </div></form>`;
    const f = $('#f');
    for (const [k, v] of Object.entries(t)) { const el = f.elements[k]; if (!el || el.type === 'file') continue; if (el.type === 'checkbox') el.checked = !!v; else el.value = v ?? ''; }
    f.elements.type.onchange = e => { t = {...t, ...readForm(f), type: e.target.value, catId: ''}; draw(); };
    $('#cancel').onclick = () => d.close();
    d.querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); openFile(a.dataset.open); });
    d.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { t = {...t, ...readForm(f), files: t.files.filter(x => x.id !== b.dataset.rm)}; fdel(b.dataset.rm); draw(); });
    if ($('#fileIn')) $('#fileIn').onchange = async e => { t = {...t, ...readForm(f)}; await attachFiles(t, [...e.target.files]); draw(); };
    if ($('#del')) $('#del').onclick = () => askConfirm('¿Eliminar este movimiento? Esta acción no se puede deshacer.', () => { (t.files || []).forEach(x => fdel(x.id)); S.tx = S.tx.filter(x => x.id !== t.id); save(); $('#dlg').close(); render(); toast('Movimiento eliminado'); });
    f.onsubmit = e => {
      const v = readForm(f);
      if (v.type === 'transferencia' && v.accountId === v.toAccountId) { alert('La cuenta origen y destino deben ser distintas.'); e.preventDefault(); return; }
      const amt = Math.round(num(v.amount) * 100) / 100;
      if (!(amt > 0)) { toast('Captura un monto mayor a 0 (ej. 1500 o 1,500.50).', true); f.elements.amount.classList.add('err'); f.elements.amount.focus(); e.preventDefault(); return; }
      const now = new Date().toLocaleString('es-MX');
      const next = {...t, ...v, amount: amt};
      if (String(v.iva ?? '').trim() === '') delete next.iva; else next.iva = rnd(num(v.iva));
      if (v.type === 'transferencia') next.catId = '';
      if (isNew) next.log = ['Creado ' + now];
      else {
        const before = S.tx.find(x => x.id === t.id);
        const ch = ['date','amount','type','status','accountId','catId','desc','reconciled'].filter(k => String(before[k]) !== String(next[k]));
        if ((before.files || []).length !== next.files.length) ch.push('facturas');
        next.log = [...before.log, 'Editado ' + now + (ch.length ? ' (' + ch.join(', ') + ')' : '')];
      }
      S.tx = isNew ? [...S.tx, next] : S.tx.map(x => x.id === t.id ? next : x);
      save(); render(); toast('Movimiento guardado ✓');
    };
  };
  draw(); if (!d.open) d.showModal();
}


/* ---------- Efectivo ---------- */
const cashAcc = () => S.accounts.find(a => a.kind === 'efectivo');
const nextMonth = m => { const [y, mo] = m.split('-').map(Number); return mo === 12 ? (y + 1) + '-01' : y + '-' + String(mo + 1).padStart(2, '0'); };
const cashFlows = (c, list) => {
  const isIn = t => t.status !== 'pendiente' && ((t.type === 'ingreso' && t.accountId === c.id) || (t.type === 'transferencia' && t.toAccountId === c.id));
  const isOut = t => t.status !== 'pendiente' && t.type === 'gasto' && t.accountId === c.id;
  const isDep = t => t.status !== 'pendiente' && t.type === 'transferencia' && t.accountId === c.id;
  const add = f => list.filter(f).reduce((s, t) => s + t.amount, 0);
  return {entra: add(isIn), gasta: add(isOut), dep: add(isDep)};
};
function vEfectivo() {
  const c = cashAcc(), m = F.efMes || today().slice(0, 7);
  const all = S.tx.filter(t => t.accountId === c.id || t.toAccountId === c.id);
  const inM = all.filter(t => ym(t.date) === m).sort((a, b) => b.date.localeCompare(a.date));
  const fl = cashFlows(c, inM), ini = balance(c, m + '-01'), fin = balance(c, nextMonth(m) + '-01');
  const gPend = inM.filter(t => t.type === 'gasto' && t.status === 'pendiente').reduce((s, t) => s + t.amount, 0), gTot = fl.gasta + gPend, quedaTodo = fin - gPend;
  const by = {}; inM.filter(t => t.type === 'gasto' && t.status !== 'pendiente').forEach(t => by[t.catId] = (by[t.catId] || 0) + t.amount);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), max = rows[0]?.[1] || 1;
  const months = [...new Set([today().slice(0, 7), m, ...all.map(t => ym(t.date))])].sort().reverse();
  const hist = months.slice(0, 12).map(k => { const del = all.filter(t => ym(t.date) === k), pend = del.filter(t => t.type === 'gasto' && t.status === 'pendiente').reduce((s, t) => s + t.amount, 0), f = cashFlows(c, del); return {k, ...f, pend, ini: balance(c, k + '-01'), fin: balance(c, nextMonth(k) + '-01'), sobra: f.entra - f.gasta - pend}; });
  const gcats = S.cats.filter(x => (x.type === 'gasto' || x.any) && !x.neutral);
  return `
  <div class="bar"><label style="margin:0">Mes
    <select data-f="efMes">${months.map(k => `<option value="${k}" ${k === m ? 'selected' : ''}>${mesLabel(k)}</option>`).join('')}</select></label>
    <button class="g" data-a="ef-in">+ Entrada de efectivo</button></div>
  <div class="grid">
    <div class="card kpi"><div class="l">Efectivo al inicio del mes</div><div class="v">${money(ini)}</div></div>
    <div class="card kpi"><div class="l">Entradas (retiros y cobros)</div><div class="v ok">${money(fl.entra)}</div></div>
    <div class="card kpi"><div class="l">Gastado y pagado</div><div class="v bad">${money(fl.gasta)}</div>${gPend ? `<div class="warn" style="font-size:12px;margin-top:4px">+ ${money(gPend)} por pagar</div>` : ''}</div>
    <div class="card kpi"><div class="l">Efectivo al final del mes</div><div class="v ${fin < 0 ? 'bad' : ''}">${money(fin)}</div></div>
  </div>
  <div class="card"><h2>Cuadre de ${mesLabel(m)}</h2><div class="tbl"><table><tbody>
    <tr><td>Efectivo al inicio del mes</td><td class="n">${money(ini)}</td></tr>
    <tr><td>+ Entradas (retiros y cobros)</td><td class="n ok">${money(fl.entra)}</td></tr>
    <tr><td>− Gastado y pagado</td><td class="n bad">${money(fl.gasta)}</td></tr>
    ${fl.dep ? `<tr><td>− Depositado al banco</td><td class="n bad">${money(fl.dep)}</td></tr>` : ''}
    <tr><td><b>= Efectivo en caja</b></td><td class="n"><b>${money(fin)}</b></td></tr>
    ${gPend ? `<tr><td>− Por pagar en efectivo (pendiente)</td><td class="n warn">${money(gPend)}</td></tr><tr><td><b>= Quedaría si pagas todo lo pendiente</b></td><td class="n ${quedaTodo < 0 ? 'bad' : ''}"><b>${money(quedaTodo)}</b></td></tr>` : ''}
    </tbody></table></div>
    <p class="mut" style="margin:12px 0 0">Total de gastos del mes (pagado + pendiente): <b style="color:var(--tx)">${money(gTot)}</b>. Como en tu hoja: entradas ${money(fl.entra)} − gastos ${money(gTot)} = <b style="color:var(--tx)">${money(fl.entra - gTot)}</b> de sobrante del mes, sin contar lo que traías del mes anterior (${money(ini)}).</p></div>
  <div class="card"><h2>Registrar gasto en efectivo</h2>
    <div class="bar" style="align-items:flex-end">
      <label style="margin:0">Fecha<input type="date" id="efDate" value="${m === today().slice(0, 7) ? today() : m + '-01'}"></label>
      <label style="margin:0;flex:1;min-width:180px">Concepto<input id="efDesc" placeholder="Ej. Iguala Rodolfo Romo septiembre"></label>
      <label style="margin:0">Categoría<select id="efCat">${gcats.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
      <label style="margin:0">A quién se pagó<input id="efParty" placeholder="Proveedor / persona"></label>
      <label style="margin:0">Monto<input type="text" inputmode="decimal" id="efAmt" placeholder="0.00" style="width:120px"></label>
      <button class="b" data-a="ef-add">Guardar</button></div>
    <div class="mut">Después puedes abrirlo con “Ver / editar” para adjuntar el recibo o la factura.</div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">

}

/* ---------- Equipo, vacaciones e incidencias ---------- */
const dparse = s => new Date(s + 'T12:00:00');
const dfmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmtDate = s => { if (!s) return ''; const d = dparse(s); return d.getDate() + ' ' + MESES[d.getMonth()].toLowerCase() + ' ' + String(d.getFullYear()).slice(2); };

const semanaDe = x => x && +x.semana === 5 ? 5 : 6;

  const a = dparse(alta), now = dparse(today());
  const at = y => { const d = new Date(a); d.setFullYear(a.getFullYear() + y); return d; };
  let years = now.getFullYear() - a.getFullYear();
  if (at(years) > now) years--;
  const last = at(Math.max(years, 0)), diffM = (x, y) => (y.getFullYear() - x.getFullYear()) * 12 + y.getMonth() - x.getMonth() - (y.getDate() < x.getDate() ? 1 : 0);
  return {years, last: dfmt(last), next: dfmt(at(years + 1)), months: diffM(a, now), monthsSince: diffM(last, now)};
}

  const sv = service(e.alta), mine = S.vac.filter(v => v.empId === e.id), cuenta = v => sv.years < 1 || v.from >= sv.last || v.cuenta;
  const taken = mine.filter(cuenta).reduce((s, v) => s + v.days, 0), antes = mine.filter(v => !cuenta(v)).reduce((s, v) => s + v.days, 0);

const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const enDias14 = s => { const d = dparse(today()); d.setDate(d.getDate() + 14); return s <= dfmt(d); };
const fmtDia = x => DIAS[dparse(x).getDay()] + ' ' + dparse(x).getDate() + ' ' + MESES[dparse(x).getMonth()].toLowerCase();
const nextWorkday = (to, semana = 6) => { const d = dparse(to); do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || (semana === 5 && d.getDay() === 6)); return dfmt(d); };
function vacProgramadas() {
  const hoy = today(), vig = S.vac.filter(v => (v.to || v.from) >= hoy).map(v => { const e = S.team.find(x => x.id === v.empId) || {}; return {...v, to: v.to || v.from, name: e.name || '—', area: e.area || '', semana: semanaDe(e)}; }).sort((a, b) => a.from.localeCompare(b.from));
  vig.forEach(x => { x.curso = x.from <= hoy; x.regresa = nextWorkday(x.to, x.semana); x.coincide = vig.filter(y => y !== x && y.empId !== x.empId && y.from <= x.to && y.to >= x.from); });

/* ---------- Auditor de RH: alertas y recomendaciones (orientación general con base en la LFT) ---------- */
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function cumple(nac) {
  if (!nac) return null;
  const n = dparse(nac), h = dparse(today()); let edad = h.getFullYear() - n.getFullYear();
  const fecha = y => { const d = new Date(y, n.getMonth(), n.getDate(), 12); if (d.getMonth() !== n.getMonth()) d.setDate(0); return d; }; // 29 feb en año no bisiesto → 28 feb

  const prog = vacProgramadas(), mes = +hoy.slice(5, 7), dia = +hoy.slice(8, 10);
  for (const e of S.team) {

    // 1) vacaciones sin tomar

      if (b.monthsSince >= 6) add('r', e, n + ' tiene ' + dias(b.avail) + ' de vacaciones vencidas', 'Pasaron más de 6 meses desde su aniversario (' + fmtDate(b.last) + ') y la ley (art. 81) obliga a otorgarlas en ese plazo. No se pueden cambiar por dinero mientras trabaja (art. 79): si no las toma, se acumulan y, al terminar la relación laboral, se pagan junto con la prima vacacional.' + exp + ' Programa fechas esta semana.');
      else if (b.monthsSince >= 4) add('p', e, 'Programa las vacaciones de ' + n + ' (' + dias(b.avail) + ')', 'Su plazo legal vence el ' + fmtDate(dfmt(lim)) + ' (6 meses después de su aniversario del ' + fmtDate(b.last) + '). Si pasa ese plazo sin tomarlas, quedan como vacaciones vencidas.' + exp);

const normT = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

const feeEn = (c, m) => { const h = m && (c.hist || []).filter(x => m <= x.hasta).sort((a, b) => a.hasta.localeCompare(b.hasta))[0]; return h ? +h.fee : +c.fee || 0; };

function clienteDe(t) {

  const d = normT(t.desc), por = S.clientes.find(c => (c.alias || []).some(a => a && d.includes(normT(a))));
  if (por) return por;

  for (let m = desde; m <= cur; m = nextMonth(m)) meses.push({m, q: cuota(c, m)});
  const cobros = S.tx.filter(t => esCobro(t) && clienteDe(t) === c && ym(t.date) >= desde).sort((a, b) => a.date.localeCompare(b.date));
  let resto = cobros.reduce((s, t) => s + t.amount, 0); const ini = +c.saldoIni || 0, iniPend = Math.max(0, ini - resto); resto = Math.max(0, resto - ini);
  meses.forEach(r => { r.pagado = Math.min(resto, r.q); resto -= r.pagado; r.pend = Math.round((r.q - r.pagado) * 100) / 100; });
  const venc = Math.round((meses.filter(r => r.m < cur).reduce((s, r) => s + r.pend, 0) + iniPend) * 100) / 100, act = meses.find(r => r.m === cur);
  return {meses, cobros, venc, mesesAtraso: meses.filter(r => r.m < cur && r.pend > 1).length + (iniPend > 1 ? 1 : 0), pendMes: act ? act.pend : 0, adelanto: Math.round(resto * 100) / 100, ultimo: cobros.at(-1) || null};
}
const cobradoEn = (c, m) => S.tx.filter(t => esCobro(t) && clienteDe(t) === c && ym(t.date) === m).reduce((s, t) => s + t.amount, 0);

function parseCFDI(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  const c = doc.getElementsByTagNameNS('*', 'Comprobante')[0]; if (!c) return null;
  const emisor = doc.getElementsByTagNameNS('*', 'Emisor')[0], tim = doc.getElementsByTagNameNS('*', 'TimbreFiscalDigital')[0];
  const receptor = doc.getElementsByTagNameNS('*', 'Receptor')[0];
  const imp = [...doc.getElementsByTagNameNS('*', 'Impuestos')].find(e => e.parentNode === c);
  return {iva: imp && imp.getAttribute('TotalImpuestosTrasladados') != null ? parseFloat(imp.getAttribute('TotalImpuestosTrasladados')) : 0, total: parseFloat(c.getAttribute('Total')), date: (c.getAttribute('Fecha') || '').slice(0, 10), emisor: emisor?.getAttribute('Nombre') || emisor?.getAttribute('Rfc') || '', receptor: receptor?.getAttribute('Nombre') || '', uuid: tim?.getAttribute('UUID') || ''};
}
async function bulkUpload(files) {
  const msg = $('#bulkMsg'); msg.textContent = 'Procesando…';
  const base = f => f.name.replace(/\.[^.]+$/, '').toLowerCase();
  const xmls = files.filter(f => /\.xml$/i.test(f.name)), others = files.filter(f => !/\.xml$/i.test(f.name));
  const out = {ok: [], no: [], sobra: []};
  const pool = S.tx.filter(needsInvoice);
  for (const f of xmls) {
    let c; try { c = parseCFDI(await f.text()); } catch {}
    if (!c || !c.total) { out.no.push(f.name + ' (no es un CFDI válido)'); continue; }
    const cand = pool.filter(t => Math.abs(t.amount - c.total) < 0.011 && Math.abs((Date.parse(t.date) - Date.parse(c.date)) / 864e5) <= 60)
      .sort((a, b) => Math.abs(Date.parse(a.date) - Date.parse(c.date)) - Math.abs(Date.parse(b.date) - Date.parse(c.date)));
    if (!cand.length) { out.no.push(`${f.name}: ${c.emisor} ${money(c.total)} — no encontré movimiento con ese monto`); continue; }
    const t = cand[0]; pool.splice(pool.indexOf(t), 1);
    const mates = others.filter(o => base(o) === base(f));
    await attachFiles(t, [f, ...mates]); mates.forEach(m => others.splice(others.indexOf(m), 1));
    if (!t.ref && c.uuid) t.ref = c.uuid;
    t.iva = c.iva;
    if (!t.party) t.party = t.type === 'ingreso' ? c.receptor : c.emisor;
    t.log.push('Factura adjunta ' + new Date().toLocaleString('es-MX') + ' (' + f.name + ')');
    out.ok.push(`${f.name} → ${t.date} ${t.desc.slice(0, 40)} (${money(t.amount)})`);
  }
  out.sobra = others.map(o => o.name);
  save();
  render();
  $('#bulkMsg').innerHTML = `${out.ok.length ? `<b class="ok">${out.ok.length} facturas emparejadas:</b><ul>${out.ok.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${out.no.length ? `<b class="warn">Sin emparejar:</b><ul>${out.no.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${out.sobra.length ? `<b class="warn">Archivos sueltos (adjúntalos a mano):</b> ${out.sobra.map(esc).join(', ')}` : ''}`;
}
function bindDrops() {
  const dr = $('#drop'); if (!dr) return;
  dr.ondragover = e => { e.preventDefault(); dr.classList.add('over'); };
  dr.ondragleave = () => dr.classList.remove('over');
  dr.ondrop = e => { e.preventDefault(); dr.classList.remove('over'); bulkUpload([...e.dataTransfer.files]); };
}
